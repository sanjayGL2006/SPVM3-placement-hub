apiVersion: v1
kind: ConfigMap
metadata:
  name: placement-config
  namespace: placement-pro
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  POSTGRES_DB: "placement_pro_db"
  POSTGRES_HOST: "postgres-service.placement-pro.svc.cluster.local"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis-service.placement-pro.svc.cluster.local"
  REDIS_PORT: "6379"
